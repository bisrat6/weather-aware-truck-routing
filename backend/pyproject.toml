[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # test functions don't need annotations

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings_test"
addopts = "-ra"
